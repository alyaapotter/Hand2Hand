<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="addInventory_admin.css"> 
    <title>Inventory Page: Add (Admin)</title>
</head>
<body>
    <header>
        <div class="logo">
        <img src="logo.png" alt="Hand2Hand logo" width="80">
        <h1>Hand2Hand</h1>
        </div>
        <nav>
            |
            <a href="dashboard.html">Dashboard</a> |
            <a href="beneficiaries.html">Beneficiaries</a> |
            <a href="eventAdmin.html">Events</a> |
            <a href="inventory.html">Inventory</a> |
            <a href="distribution.html">Distribution</a>
        </nav>

        <button class="logout-btn">Logout</button>
    </header>

    <div class="title">
        <h1>Inventory</h1>
    </div>

    <section class="add-item">
        <div>
            <p class="text">Add New Item</p>
        </div>

        <div class="form-container">
            <label>Item:</label>
            <input type="text" id="itemInput" placeholder="Item" required>
            <div id="itemError" class="error-msg"></div>
        </div>

        <div class="form-container">
            <label>Category:</label>
            <input type="text" id="categoryInput" placeholder="Category" required>
            <div id="categoryError" class="error-msg"></div>
        </div>

        <div class="form-container">
            <label>Quantity:</label>
            <input type="text" id="qtyInput" placeholder="Quantity" required>
            <div id="qtyError" class="error-msg"></div>
        </div>

        <button id="addBtn" class="add-btn">Add New Item</button>
    </section>

    <script>
        
        // get input values
        let itemInput = document.getElementById("itemInput");
        let categoryInput = document.getElementById("categoryInput");
        let qtyInput = document.getElementById("qtyInput");
        let updateBtn = document.getElementById("updateBtn");

        function validateQuantity(value)
        {
            let trimmed = value.trim();
            // if else validation for numbers
            if (trimmed == "")
            {
                return {valid: false, message: "Quantity cannot be empty." };
            }

            let num = Number(trimmed);
            if (isNaN(num)) 
            {
                return { valid: false, message: "Quantity must be a number." };
            }

            // check for negative numbers using if-else
            if (num < 0) 
            {
                return { valid: false, message: "Quantity cannot be negative." };
            }

            // check for decimals using if-else
            if (trimmed.includes('.')) 
            {
                return { valid: false, message: "Quantity cannot be a decimal. Please enter a whole number." };
            }

            // check if it's zero
            if (num == 0) 
            {
                return { valid: false, message: "Quantity cannot be zero. Please enter a positive number." };
            }

            // check if it's a positive whole number
            if (num > 0 && Number.isInteger(num)) 
            {
                return { valid: true, value: num };
            }

            return { valid: false, message: "Please enter a valid positive whole number." };
        }

         addBtn.addEventListener('click', function()
         {
            let itemValue = itemInput.value;
            let categoryValue = categoryInput.value;
            let qtyValue = qtyInput.value; 

            // check if item and category is empty using if-else
            if (!itemValue || itemValue.trim() === "") 
            {
                alert("Error: Item cannot be empty!");
                return;
            }

            if (!categoryValue || categoryValue.trim() === "") 
            {
                alert("Error: Category cannot be empty!");
                return;
            }

            // validate quantity using if-else structure
            let qtyValidation = validateQuantity(qtyValue);

            if (!qtyValidation.valid) 
            {
                alert("Error: " + qtyValidation.message);
                return;
            }

            // ff all validations pass, show success popup
            alert(`Stock updated successfully! \n\nItem: ${itemValue.trim()} \nCategory: ${categoryValue.trim()} \nQuantity: ${qtyValidation.value}`);
        });

         
    </script>
</body>
</html>
