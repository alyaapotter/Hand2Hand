<!DOCTYPE html>
<html>
<head>
    <title>Create Donation Event</title>
    <link rel="stylesheet" href="format.css">
</head>

<body>

<header class="header2">

    <div class="top-header">
        <div class="logo">
            <img src="logo.png" alt="Hand2Hand logo" width="80">
            <h1>Hand2Hand</h1>
        </div>
        <button class="logout-btn">Logout</button>
    </div>

        <nav>
            <a href="#">Dashboard</a> |
            <a href="#">Beneficiaries</a> |
            <a href="donation_event_admin.html">Events</a> |
            <a href="#">Inventory</a> |
            <a href="#">Distribution</a>
        </nav>

</header>

<div class="page-title2">
        <h1>Donation Events</h1>
</div>

<section class="event-management">

    <form class="event-form">
        <div class="left-panel">
        <label>Event Name</label>
        <input type="text" placeholder="Enter event name">

        <label>Start Date</label>
        <input type="date">

        <label>End Date</label>
        <input type="date">

        <label>Description</label>
        <textarea></textarea>

        <label>Status</label>
        <select>
            <option>Active</option>
            <option>Upcoming</option>
            <option>Ended</option>
        </select>

        <button type="submit" class="submit-btn">
            <h3>Create</h3>
        </button>
        </div>

        <div class="right-panel">
        <label>Target Item</label>
        <div class="target-input">
            <input type="text" placeholder="e.g. Rice 5kg">
            <input type="number" placeholder="Quantity" min="1">
            <button type="button" class="add-item-btn">Add</button>
        </div>

        <div class="target-list">

            <h3>Target Item List</h3>

            <div class="target-row">
                <span class="item-name">Rice 5kg</span>
                <span class="item-qty">10</span>
                <button class="remove-btn">Remove</button>
            </div>

            <div class="target-row">
                <span class="item-name">Cooking Oil</span>
                <span class="item-qty">20</span>
                <button class="remove-btn">Remove</button>
            </div>

        </div>
    </div>

    </form>
</section>
</body>
</html>
