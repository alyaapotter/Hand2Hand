<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="format.css"> 
    <title>Inventory Page: Update (Admin)</title>
</head>
<body>
    <header>
        <div class="logo">
        <img src="logo.png" alt="Hand2Hand logo" width="80">
        <h1>Hand2Hand</h1>
        </div>
        <nav>
            |
            <a href="dashboard.html">Dashboard</a> |
            <a href="beneficiaries.html">Beneficiaries</a> |
            <a href="eventAdmin.html">Events</a> |
            <a href="inventory.php">Inventory</a> |
            <a href="distribution.html">Distribution</a>
        </nav>

        <button class="logout-btn">Logout</button>
    </header>

    <div class="title">
        <h1>Inventory</h1>
    </div>

    <section class="update-stock">
        <div>
            <p class="text">Update Stock</p>
        </div>

        <form method = "POST" action = "update.php" onsubmit="return validateForm(event)">
            <div class="form-container">
                <label>Item:</label>
                <input type="text" name="item" id="item" placeholder="Item">
                <div id="itemError" class="error-msg"></div>
            </div>

            <div class="form-container">
                <label>Quantity:</label>
                <input type="text" name="quantity" id="quantity" placeholder="Quantity">
                <div id="qtyError" class="error-msg"></div>
            </div>

            <!-- create a submit button -->
            <button type="submit" name="action" value="add">Update Item</button>
        </form>
    </section>

    <script>
        function validateForm(event) 
        {
            event.preventDefault();
            let item = document.getElementById("item").value.trim();
            let quantity = document.getElementById("quantity").value.trim();

            // check empty fields
            if (item == "" || quantity == "")
            {
                alert("All fields are required.")
                event.preventDefault();
                return false;
            }

            // check quantity is a whole num (no decimal & negative num)
            if (isNaN(quantity) || !Number.isInteger(Number(quantity)) || Number(quantity) <= 0)
            {
                alert("Quantity must be a non-negative whole number.");
                return false;
            }

            // alert("Update Successful!");
            // return true;
        }
    </script>
</body>
</html>
