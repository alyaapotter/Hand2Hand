<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="inventory_admin.css"> 
    <title>Inventory Page (Admin)</title>
</head>

<body>
    <header>
        <div class="logo">
        <img src="logo.png" alt="Hand2Hand logo" width="80">
        <h1>Hand2Hand</h1>
        </div>
        <nav>
            |
            <a href="dashboard.html">Dashboard</a> |
            <a href="beneficiaries.html">Beneficiaries</a> |
            <a href="eventAdmin.html">Events</a> |
            <a href="inventory.html">Inventory</a> |
            <a href="distribution.html">Distribution</a>
        </nav>

        <button class="logout-btn">Logout</button>
    </header>

    <div class="search">
        <h1>Inventory</h1>
    </div>
    
    <input class="search-bar" type="text" placeholder="Search">
    
    <section class="inventory-list">
        <div>
            <p class="text">Inventory List</p>
        </div>

        <form onsubmit="return validateForm(event)">
            <table class="table-container">
            <tr>	
                <td>Item Name</td>
                <td><input type="text" name="item" id="item"/></td>	
            </tr>

            <tr>	
                <td>Quantity Available</td> 	
                <td> <input type = "text" name = "quantity" id="quantity"/></td>
            </tr> 
        
            <tr>
                <td>Status</td>
                <td><input type = "text" name = "status" id="status"/></td>
            </tr>
            <br />
            </table>

            <!-- create a submit button -->
            <button type="submit" name="action" value="update">Update Stock</button>
            <button type="submit" name="action" value="add">Add New Item</button>
	    </form>
    </section>

    <script>
        function validateForm(event) 
        {
            event.preventDefault();
            let item = document.getElementById("item").value.trim();
            let quantity = document.getElementById("quantity").value.trim();
            let status = document.getElementById("status").value.trim();

            // check empty fields
            if (item == "" || quantity == "" || status == "")
            {
                alert("All fields are required.")
                event.preventDefault();
                return false;
            }

            // check quantity is a whole num (no decimal & negative num)
            if (isNaN(quantity) || !Number.isInteger(Number(quantity)) || Number(quantity) < 0)
            {
                alert("Quantity must be a non-negative whole number.");
                return false;
            }

            alert("Form is valid!");
            return true;
        }
    </script>
</body>
</html>
